[workspace]
resolver = "2"
members = ["crates/pv", "crates/model", "crates/store", "crates/weather", "crates/engine", "crates/app", "crates/cli", "crates/ffi", "spikes/store", "spikes/shading"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
version = "0.0.1"
rust-version = "1.85"

[profile.release]
debug = 1

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.42", features = ["bundled"] }
sha2 = "0.11.1"
ureq = "3.5.2"
clap = { version = "4.6.7", features = ["derive"] }
