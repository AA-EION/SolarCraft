[package]
name = "solarcraft-app"
description = "SolarCraft application services: the single computation path shared by CLI, MCP and native shells"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
schema = ["dep:schemars", "solarcraft-report/schema"]

[dependencies]
schemars = { version = "1.0", optional = true }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
calamine = "0.38"
chrono = { version = "0.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
roxmltree = "0.21"
zip = { version = "9.6", default-features = false, features = ["deflate"] }
flate2 = "1"
solarcraft-pv = { path = "../pv" }
solarcraft-model = { path = "../model" }
solarcraft-scene = { path = "../scene" }
base64 = "0.22"
solarcraft-geometry = { path = "../geometry" }
solarcraft-store = { path = "../store" }
solarcraft-weather = { path = "../weather" }
solarcraft-engine = { path = "../engine" }
solarcraft-report = { path = "../report" }
solarcraft-catalog = { path = "../catalog" }

[dev-dependencies]
rusqlite.workspace = true
