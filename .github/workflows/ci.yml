# SPDX-License-Identifier: GPL-3.0-or-later
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (linux, tests + pvlib oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show && cargo --version
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release
      - run: cargo clippy --workspace --release -- -D warnings
      - name: C ABI smoke test
        run: |
          cc -O2 -Icrates/ffi/include crates/ffi/tests/c/smoke.c target/release/libsolarcraft_ffi.a -lpthread -ldl -lm -o smoke
          ./smoke
      - name: Shading fixtures
        run: target/release/spike-shading
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: pvlib oracle (spike D)
        run: |
          python -m pip install pvlib==0.16.1
          python -I spikes/pv-oracle/compare.py target/release/pvchain "$RUNNER_TEMP/pvd" > report.json
          python -I - <<'PY'
          import json
          m = json.load(open("report.json"))["metrics"]
          bad = {k: v["max_rel_where_ref>1"] for k, v in m.items() if v["max_rel_where_ref>1"] > 1e-4}
          print(json.dumps({k: v["max_abs"] for k, v in m.items()}, indent=1))
          assert not bad, bad
          PY

  windows:
    name: windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, iss: x64, rid: win-x64, target: x86_64-pc-windows-msvc, run: true }
          - { arch: ARM64, iss: arm64, rid: win-arm64, target: aarch64-pc-windows-msvc, run: false }
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: cargo build --release -p solarcraft-ffi --target ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Publish WinUI 3 shell
        shell: pwsh
        run: |
          $dll = Resolve-Path "target/${{ matrix.target }}/release/solarcraft_ffi.dll"
          dotnet publish apps/windows/SolarCraft.Windows/SolarCraft.Windows.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} -p:SolarCraftCoreDll=$dll -o out/${{ matrix.rid }}
          Get-ChildItem out/${{ matrix.rid }} | Select-Object -First 15
      - name: Self-test
        if: matrix.run
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/${{ matrix.rid }}/SolarCraft.exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: solarcraft-${{ matrix.rid }}
          path: out/${{ matrix.rid }}
          retention-days: 7
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw "choco failed" } }
          $src = Resolve-Path "out/${{ matrix.rid }}"
          & $iscc /Q "/DArch=${{ matrix.iss }}" "/DSrcDir=$src" "/DAppVersion=0.0.1.${{ github.run_number }}" "/DOutDir=$pwd\installer" packaging/windows/SolarCraft.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed: $LASTEXITCODE" }
          Get-ChildItem installer
      - name: Installed app self-test (silent install, run, uninstall)
        if: matrix.run
        shell: pwsh
        run: packaging/windows/test-installer.ps1 (Get-ChildItem installer/*.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: SolarCraft-setup-${{ matrix.rid }}
          path: installer/*.exe
          retention-days: 30

  windows-arm64-test:
    name: windows ARM64 self-test (native)
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: { name: solarcraft-win-arm64, path: app }
      - shell: pwsh
        run: |
          $p = Start-Process -FilePath app/SolarCraft.exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - uses: actions/checkout@v4
        with: { path: src, sparse-checkout: packaging }
      - uses: actions/download-artifact@v4
        with: { name: SolarCraft-setup-win-arm64, path: installer }
      - name: Installed app self-test (native ARM64)
        shell: pwsh
        run: src/packaging/windows/test-installer.ps1 (Get-ChildItem installer/*.exe).FullName

  macos:
    name: macos universal
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && xcodebuild -version && swift --version && uname -m
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Universal core static library
        run: |
          cargo build --release -p solarcraft-ffi --target aarch64-apple-darwin
          cargo build --release -p solarcraft-ffi --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create target/aarch64-apple-darwin/release/libsolarcraft_ffi.a target/x86_64-apple-darwin/release/libsolarcraft_ffi.a -output target/universal/libsolarcraft_ffi.a
          lipo -info target/universal/libsolarcraft_ffi.a
      - name: Build SwiftUI shell (arm64 + x86_64)
        working-directory: apps/macos
        run: |
          swift build -c release --arch arm64 --arch x86_64 -Xlinker -L$GITHUB_WORKSPACE/target/universal
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/SolarCraftMac
          lipo -info "$BIN"
          echo "BIN=$BIN" >> $GITHUB_ENV
      - name: Self-test arm64
        run: arch -arm64 "$BIN" --selftest
      - name: Self-test x86_64 slice under Rosetta (not real Intel hardware)
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 "$BIN" --selftest
      - name: App bundle and DMG
        run: |
          DMG=$(packaging/macos/make-dmg.sh "$BIN" 0.0.1 ${{ github.run_number }} "$RUNNER_TEMP/dmg" | tail -1)
          echo "DMG=$DMG" >> $GITHUB_ENV
      - name: Self-test from the mounted DMG (arm64 and x86_64 under Rosetta)
        run: |
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          codesign --verify --strict "$MNT/SolarCraft.app"
          arch -arm64 "$MNT/SolarCraft.app/Contents/MacOS/SolarCraft" --selftest
          arch -x86_64 "$MNT/SolarCraft.app/Contents/MacOS/SolarCraft" --selftest
          hdiutil detach "$MNT"
      - uses: actions/upload-artifact@v4
        with:
          name: SolarCraft-macos-universal-dmg
          path: ${{ env.DMG }}
          retention-days: 30
